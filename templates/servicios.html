{% extends "base.html" %}

{% block title %}Servicios{% endblock %}

{% block content %}
<section>
    <h1>Servicios</h1>
    <p class="intro">Todo lo que puedes hacer en Willbookstore, además de comprar un libro.</p>

    <ul class="lista-servicios">
        {% for servicio in servicios %}
        <li class="servicio">
            <h3>{{ servicio.nombre }}</h3>
            <p>{{ servicio.detalle }}</p>
        </li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
